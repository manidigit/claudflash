name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build (assembleDebug)
        run: gradle clean assembleDebug --stacktrace

      - name: Unit tests
        run: gradle test --stacktrace

      - name: Stage APK artifacts (flat dist/ folder)
        if: always()
        run: |
          mkdir -p dist
          find . -path "*/outputs/apk/*" -name "*.apk" -exec cp {} dist/ \; || true

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flashlearn-debug-apk
          path: dist/*.apk
          if-no-files-found: warn

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
