name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.2'

      - name: Build debug APK
        run: gradle clean assembleDebug --stacktrace --no-daemon

      - name: Run unit tests
        run: gradle test --stacktrace --no-daemon

      - name: Stage APK artifacts
        if: always()
        run: |
          mkdir -p dist
          find . -path "*/outputs/apk/*" -name "*.apk" -exec cp {} dist/ \; || true

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flashlearn-debug-apk
          path: dist/*.apk
          if-no-files-found: warn

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore